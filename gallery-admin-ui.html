<!-- ============================================
GALLERY MANAGEMENT TAB FOR ADMIN PAGE
Add this as a new tab in admin.html
============================================ -->

<!-- Add this to the tab navigation at the top of admin.html -->
<button class="tab-button" onclick="switchTab('gallery-tab')" data-tab="gallery-tab">
  📸 Gallery
</button>

<!-- Add this as a new tab content section in admin.html -->
<div id="gallery-tab" class="tab-content" style="display: none;">
  <div class="admin-section">
    <h2>📸 Image Gallery Management</h2>
    <p class="section-description">Manage images displayed in the gallery on your website</p>

    <!-- Upload New Image -->
    <div class="form-section">
      <h3>Upload New Image</h3>
      <form id="gallery-upload-form" enctype="multipart/form-data">
        <div class="form-row">
          <div class="form-group full-width">
            <label for="gallery-image-input">Image File *</label>
            <div class="file-upload-area" id="file-upload-area">
              <input
                type="file"
                id="gallery-image-input"
                name="image"
                accept="image/*"
                required
                style="display: none;"
              />
              <p>📁 Drag image here or <a href="#" onclick="document.getElementById('gallery-image-input').click(); return false;">choose file</a></p>
              <small>PNG, JPG, GIF (max 5MB)</small>
              <div id="file-preview-area" style="margin-top: 15px;"></div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="gallery-title">Title *</label>
            <input type="text" id="gallery-title" name="title" placeholder="e.g., T-Shirt Branding Project" required />
          </div>
          <div class="form-group">
            <label for="gallery-category">Category</label>
            <select id="gallery-category" name="category">
              <option value="General">General</option>
              <option value="Clothing">Clothing</option>
              <option value="Printing">Printing</option>
              <option value="Signage">Signage</option>
              <option value="Vehicle Branding">Vehicle Branding</option>
              <option value="Promotional Items">Promotional Items</option>
              <option value="Custom">Custom</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="gallery-description">Description</label>
            <textarea id="gallery-description" name="description" placeholder="Describe this project or image" rows="3"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Upload Image</button>
        </div>
      </form>
    </div>

    <!-- Existing Gallery Items -->
    <div class="form-section">
      <h3>Current Gallery Images</h3>
      <div id="gallery-loading" class="loading-spinner" style="display: none;">Loading gallery...</div>
      <div id="gallery-items-container" style="display: none;">
        <div id="gallery-items-list">
          <!-- Gallery items will be populated here -->
        </div>
      </div>
      <div id="gallery-empty" class="empty-state" style="display: none;">
        <p>No images in gallery yet. Upload one above!</p>
      </div>
    </div>
  </div>
</div>

<!-- Add this CSS to admin.css -->
<style>
.file-upload-area {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  background-color: #f9f9f9;
}

.file-upload-area:hover {
  border-color: #007bff;
  background-color: #f0f8ff;
}

.file-upload-area.dragover {
  border-color: #007bff;
  background-color: #e7f3ff;
}

.file-preview-container {
  margin-top: 15px;
  text-align: center;
}

.file-preview-container img {
  max-width: 200px;
  max-height: 200px;
  border-radius: 4px;
  border: 1px solid #ddd;
}

.gallery-item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 4px;
  background-color: #f9f9f9;
}

.gallery-item-thumbnail {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid #ddd;
}

.gallery-item-details {
  flex: 1;
}

.gallery-item-title {
  font-weight: bold;
  margin-bottom: 5px;
}

.gallery-item-category {
  font-size: 0.9em;
  color: #666;
  margin-bottom: 5px;
}

.gallery-item-status {
  font-size: 0.85em;
}

.gallery-item-status.active {
  color: #28a745;
}

.gallery-item-status.inactive {
  color: #dc3545;
}

.gallery-item-actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.gallery-item-actions button {
  padding: 5px 10px;
  font-size: 0.9em;
}

.drag-handle {
  cursor: grab;
  color: #999;
  font-size: 1.2em;
  user-select: none;
}

.drag-handle:active {
  cursor: grabbing;
}

.gallery-items-list.sortable {
  background-color: #f5f5f5;
  border-radius: 4px;
}

.empty-state {
  text-align: center;
  padding: 40px;
  color: #999;
  border: 1px solid #ddd;
  border-radius: 4px;
  background-color: #f9f9f9;
}
</style>

<!-- Add this JavaScript to admin.js -->
<script>
// ============================================
// GALLERY MANAGEMENT JAVASCRIPT
// Add to admin.js
// ============================================

// File upload drag & drop
function setupGalleryUpload() {
  const uploadArea = document.getElementById('file-upload-area');
  const fileInput = document.getElementById('gallery-image-input');
  const previewArea = document.getElementById('file-preview-area');

  if (!uploadArea) return;

  // Click to select file
  uploadArea.addEventListener('click', () => fileInput.click());

  // Drag & drop
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    fileInput.files = e.dataTransfer.files;
    updateFilePreview();
  });

  // File input change
  fileInput.addEventListener('change', updateFilePreview);

  // Form submission
  const form = document.getElementById('gallery-upload-form');
  if (form) {
    form.addEventListener('submit', uploadGalleryImage);
  }
}

function updateFilePreview() {
  const fileInput = document.getElementById('gallery-image-input');
  const previewArea = document.getElementById('file-preview-area');

  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => {
      previewArea.innerHTML = `
        <div class="file-preview-container">
          <img src="${e.target.result}" alt="Preview" />
          <p style="margin-top: 10px; font-size: 0.9em; color: #666;">
            ${fileInput.files[0].name}
          </p>
        </div>
      `;
    };
    reader.readAsDataURL(fileInput.files[0]);
  }
}

async function uploadGalleryImage(e) {
  e.preventDefault();

  const fileInput = document.getElementById('gallery-image-input');
  const titleInput = document.getElementById('gallery-title');
  const categoryInput = document.getElementById('gallery-category');
  const descriptionInput = document.getElementById('gallery-description');

  if (!fileInput.files[0]) {
    alert('Please select an image');
    return;
  }

  const formData = new FormData();
  formData.append('image', fileInput.files[0]);
  formData.append('title', titleInput.value);
  formData.append('category', categoryInput.value);
  formData.append('description', descriptionInput.value);

  try {
    const response = await fetch('/api/admin/gallery', {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
      const error = await response.json();
      alert('Error uploading image: ' + (error.error || 'Unknown error'));
      return;
    }

    alert('Image uploaded successfully!');
    document.getElementById('gallery-upload-form').reset();
    document.getElementById('file-preview-area').innerHTML = '';
    loadGalleryItems();
  } catch (error) {
    console.error('Upload error:', error);
    alert('Error uploading image: ' + error.message);
  }
}

async function loadGalleryItems() {
  const container = document.getElementById('gallery-items-container');
  const empty = document.getElementById('gallery-empty');
  const loading = document.getElementById('gallery-loading');
  const itemsList = document.getElementById('gallery-items-list');

  if (!container) return;

  loading.style.display = 'block';
  container.style.display = 'none';
  empty.style.display = 'none';

  try {
    const response = await fetch('/api/admin/gallery');
    const items = await response.json();

    loading.style.display = 'none';

    if (items.length === 0) {
      empty.style.display = 'block';
      return;
    }

    container.style.display = 'block';
    itemsList.innerHTML = items.map(item => `
      <div class="gallery-item" data-id="${item.id}">
        <span class="drag-handle">⋮⋮</span>
        <img src="${item.imageUrl}" alt="${item.title}" class="gallery-item-thumbnail" />
        <div class="gallery-item-details">
          <div class="gallery-item-title">${item.title}</div>
          <div class="gallery-item-category">${item.category}</div>
          <div class="gallery-item-status ${item.active ? 'active' : 'inactive'}">
            ${item.active ? '✓ Active' : '✕ Inactive'}
          </div>
        </div>
        <div class="gallery-item-actions">
          <button type="button" class="btn btn-sm" onclick="toggleGalleryItemActive(${item.id}, ${!item.active})">
            ${item.active ? 'Deactivate' : 'Activate'}
          </button>
          <button type="button" class="btn btn-sm btn-danger" onclick="deleteGalleryItem(${item.id})">
            Delete
          </button>
        </div>
      </div>
    `).join('');

    // Make items sortable
    makeGallerySortable();
  } catch (error) {
    console.error('Error loading gallery:', error);
    loading.style.display = 'none';
    empty.style.display = 'block';
  }
}

async function toggleGalleryItemActive(id, active) {
  try {
    const response = await fetch(`/api/admin/gallery/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ active })
    });

    if (response.ok) {
      loadGalleryItems();
    } else {
      alert('Error updating image');
    }
  } catch (error) {
    console.error('Error updating gallery item:', error);
    alert('Error updating image');
  }
}

async function deleteGalleryItem(id) {
  if (!confirm('Are you sure you want to delete this image?')) return;

  try {
    const response = await fetch(`/api/admin/gallery/${id}`, {
      method: 'DELETE'
    });

    if (response.ok) {
      loadGalleryItems();
    } else {
      alert('Error deleting image');
    }
  } catch (error) {
    console.error('Error deleting gallery item:', error);
    alert('Error deleting image');
  }
}

function makeGallerySortable() {
  // Simple drag-and-drop reordering
  // This would require a library like Sortable.js for production
  // For now, we'll keep it simple with manual order updates
  const items = document.querySelectorAll('.gallery-item');
  let draggedItem = null;

  items.forEach(item => {
    item.draggable = true;

    item.addEventListener('dragstart', (e) => {
      draggedItem = item;
      item.style.opacity = '0.5';
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', (e) => {
      item.style.opacity = '1';
      draggedItem = null;
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });

    item.addEventListener('drop', async (e) => {
      e.preventDefault();
      if (draggedItem && draggedItem !== item) {
        // Swap items in DOM
        item.parentNode.insertBefore(draggedItem, item);

        // Save new order
        const newOrder = Array.from(document.querySelectorAll('.gallery-item')).map((el, idx) => ({
          id: el.dataset.id,
          order: idx + 1
        }));

        try {
          await fetch('/api/admin/gallery/reorder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orders: newOrder })
          });
        } catch (error) {
          console.error('Error reordering gallery:', error);
        }
      }
    });
  });
}

// Initialize on tab switch
function initGalleryTab() {
  setupGalleryUpload();
  loadGalleryItems();
}

// Call this when gallery tab is switched to
// Add to the switchTab function or call when tab is activated
</script>
