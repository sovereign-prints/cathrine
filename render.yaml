databases:
  - name: sovereign-prints-db
    plan: free
    databaseName: sovereignprints
    user: sovereignprints

services:
  - type: web
    name: sovereign-prints
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sovereign-prints-db
          property: connectionString
