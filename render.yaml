services:
  # ---------------------------------------------------------------------------
  # API + admin. Serves /api/*, uploaded files, admin.html and
  # order-tracking.html. The admin session cookie stays same-origin here.
  # ---------------------------------------------------------------------------
  - type: web
    name: sovereign-prints
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Comma-separated list of origins allowed to call the API cross-origin.
      # Set this to the static site's URL once it has been created, e.g.
      # https://sovereign-prints-web.onrender.com,https://www.sovereignprints.co.za
      - key: STATIC_SITE_ORIGINS
        sync: false
      # Deploy hook URL of the static service (Render > static site > Settings >
      # Deploy Hook). Required for the "Update website now" button in the admin
      # panel: the static build fetches products/gallery/categories/settings
      # from this API at build time (see build-static.sh), so this is now how
      # content edits reach the public site, not just design/layout changes.
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      # Set to "true" to rebuild automatically a couple of minutes after admin
      # content changes, instead of requiring a click on "Update website now".
      # Left off by default so publishing stays a deliberate admin action.
      - key: AUTO_PUBLISH
        value: "false"

  # ---------------------------------------------------------------------------
  # Customer-facing static site. Plain HTML/CSS/JS, served from Render's CDN.
  # It talks to the web service above over the public API.
  # ---------------------------------------------------------------------------
  - type: web
    runtime: static
    name: sovereign-prints-site
    buildCommand: ./build-static.sh
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # The web service's URL. Overrides the default baked into config.js at
      # build time, e.g. https://cathrine.onrender.com
      - key: API_HOST
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /404.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=2592000, immutable
